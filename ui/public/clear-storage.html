<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Storage - CECBS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
        }
        .status {
            padding: 1rem;
            border-radius: 8px;
            margin: 1.5rem 0;
            font-weight: 600;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .button {
            display: inline-block;
            padding: 12px 30px;
            margin: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        ul {
            text-align: left;
            margin: 1rem 0;
            padding-left: 2rem;
        }
        li {
            margin: 0.5rem 0;
        }
        .emoji {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🧹</div>
        <h1>Storage Cleared</h1>
        
        <div id="status" class="status success">
            ✅ Local Storage and Session Storage have been cleared!
        </div>
        
        <div class="info">
            <strong>What was cleared:</strong>
            <ul>
                <li>Authentication token</li>
                <li>User session data</li>
                <li>Cached user information</li>
                <li>All localStorage items</li>
                <li>All sessionStorage items</li>
            </ul>
        </div>
        
        <div style="margin-top: 2rem;">
            <button onclick="goToLogin()" class="button btn-primary">
                Go to Login Page
            </button>
            <button onclick="checkStorage()" class="button btn-secondary">
                Verify Cleared
            </button>
        </div>
        
        <div id="verification" style="margin-top: 1rem; color: #666; font-size: 14px;"></div>
    </div>

    <script>
        // Clear everything on page load
        window.onload = function() {
            // Clear localStorage
            localStorage.clear();
            
            // Clear sessionStorage
            sessionStorage.clear();
            
            // Clear all cookies
            document.cookie.split(";").forEach(function(c) { 
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
            });
            
            console.log('✅ Storage cleared successfully!');
            console.log('localStorage length:', localStorage.length);
            console.log('sessionStorage length:', sessionStorage.length);
        };

        function goToLogin() {
            window.location.href = '/login';
        }

        function checkStorage() {
            const localCount = localStorage.length;
            const sessionCount = sessionStorage.length;
            const verification = document.getElementById('verification');
            
            if (localCount === 0 && sessionCount === 0) {
                verification.innerHTML = '✅ Verified: Storage is completely empty!';
                verification.style.color = '#155724';
            } else {
                verification.innerHTML = `⚠️ Warning: Found ${localCount} localStorage items and ${sessionCount} sessionStorage items`;
                verification.style.color = '#856404';
            }
        }
    </script>
</body>
</html>
