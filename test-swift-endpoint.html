<!DOCTYPE html>
<html>
<head>
    <title>Test SWIFT Endpoint</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Test SWIFT Messages Endpoint</h1>
    <button onclick="testEndpoint()">Test Endpoint</button>
    <div id="result"></div>

    <script>
        async function testEndpoint() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing...</p>';

            try {
                // First login to get a real token
                const loginResponse = await fetch('http://localhost:3001/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: 'bankAdmin',
                        password: 'password123'
                    })
                });

                const loginData = await loginResponse.json();
                
                if (!loginData.success) {
                    throw new Error('Login failed: ' + (loginData.error?.message || 'Unknown error'));
                }

                const token = loginData.token;
                console.log('✅ Logged in, token:', token.substring(0, 50) + '...');

                // Now test SWIFT endpoint
                const swiftResponse = await fetch('http://localhost:3001/api/v1/swift/messages', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const swiftData = await swiftResponse.json();
                
                if (swiftData.success) {
                    resultDiv.innerHTML = `
                        <h2 class="success">✅ SUCCESS!</h2>
                        <p><strong>Count:</strong> ${swiftData.count}</p>
                        <p><strong>Messages:</strong> ${swiftData.data?.length || 0}</p>
                        <h3>First Message:</h3>
                        <pre>${JSON.stringify(swiftData.data?.[0], null, 2)}</pre>
                        <h3>Full Response:</h3>
                        <pre>${JSON.stringify(swiftData, null, 2).substring(0, 2000)}...</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h2 class="error">❌ API returned success=false</h2>
                        <pre>${JSON.stringify(swiftData, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h2 class="error">❌ Error</h2>
                    <p>${error.message}</p>
                    <pre>${error.stack}</pre>
                `;
            }
        }
    </script>
</body>
</html>
